[package]
name = "memory"
version = "0.0.0"
authors = [
    "Andrey Vasnetsov <vasnetsov93@gmail.com>",
    "Qdrant Team <info@qdrant.tech>",
]
license = "Apache-2.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
ahash = { workspace = true }
bitvec = { workspace = true }
delegate = { workspace = true }
fs-err = "3.3.0" # TODO: use workspace=true
itertools = { workspace = true }
log = { workspace = true }
memmap2 = { workspace = true }
nix = { workspace = true }
parking_lot = { workspace = true }
quick_cache = "0.6.18"
serde = { workspace = true }
thiserror = { workspace = true }
zerocopy = { workspace = true }
trififo = { path= "../../trififo" }

[dev-dependencies]
fs-err = { workspace = true, features = ["debug", "debug_tokio"] }
rand = { workspace = true }
tempfile = { workspace = true }
